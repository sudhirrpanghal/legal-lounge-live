<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bare Acts Library</title>
<meta name="description" content="Central Acts of India in clean, searchable text.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2312294a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23d4a74a' font-family='Georgia,serif'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head" id="head">
  <div class="head-in">
    <a class="brand" href="#/" id="brand"><span class="mark">&sect;</span><span id="brand-name">Bare Acts Library</span></a>
    <div class="searchbox head-search" id="head-search" hidden>
      <input id="q-head" type="search" placeholder="Search: BNS 103, Article 21, contract" autocomplete="off" aria-label="Search Acts and sections">
      <div class="results" id="r-head" role="listbox" hidden></div>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme" title="Light / dark">&#9680;</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript><p class="notice">This site needs JavaScript to display the Acts.</p></noscript>
  <div id="app"><p class="loading">Loading&hellip;</p></div>
</main>

<footer class="site-foot">
  <p id="disclaimer"></p>
  <p class="small" id="foot-meta"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
